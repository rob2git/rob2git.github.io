<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write & True</title>
<meta name="description" content="Writing on design, process, and work from Robert Barreto-Bajana.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="nav-brand" href="index.html" data-site="name">Robert Barreto-Bajana</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="cv.html">CV</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="layout">
    <div class="layout-margin">
      <div class="layout-margin-inner">ALL POSTS</div>
    </div>
    <div class="layout-main">
      <p class="eyebrow">Write & True</p>
      <h1>My Journal</h1>
      <p class="hero-sub">Short, occasional posts on design, process, and the work of making things.</p>

      <input
        class="search-field"
        type="search"
        placeholder="Search posts…"
        aria-label="Search posts"
        data-post-search
      >

      <div class="post-grid" data-all-posts></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="layout">
    <div class="layout-margin"></div>
    <div class="layout-main">
      <div class="footer-content">
        <span>&copy; <span data-year></span> <span data-site="name">Robert Barreto-Bajana</span></span>
        <div data-site-social></div>
        <div>Site hosted at <a href="https://www.github.com">Github</a></div>
      </div>
    </div>
  </div>
</footer>

<script src="js/site-config.js"></script>
<script src="js/posts-data.js"></script>
<script src="js/main.js"></script>
